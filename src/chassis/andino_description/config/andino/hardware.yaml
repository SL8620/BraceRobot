left_wheel_name: left_wheel_joint
right_wheel_name: right_wheel_joint
serial_device: /dev/ttyUSB_ARDUINO
baud_rate: 57600
timeout: 1000
enc_ticks_per_rev: 585
can_channel: 0
# NOTE: If forward/back is OK but yaw (left/right) is reversed, the most common cause is
# left/right motor CAN IDs being swapped relative to physical wheel mounting.
left_motor_id: 8      # 左轮对应电机的 CAN node ID
right_motor_id: 7     # 右轮对应电机的 CAN node ID