# 高层状态到动作序列的配置
# 单位：
#   motor1/motor2: 度 (deg)，内部会转换为 rad 发送到 /motor/position_cmd
#   lifter: 毫米 (mm)，发送到 /lifter_cmd
#   delay: 秒 (s)，表示电机动作完成到电缸动作之间的等待时间

states:
  idle:
    - motor1: 0.0
      motor2: 0.0
      motor3: 0.0
      motor4: 0.0
      motor5: 0.0
      motor6: 0.0
      lifter: 60      # 电缸中间高度
      delay: 0.0
      
  low:
    # Step 2: 再动电机
    - motor1: -18.0
      motor2: -18.0
      motor3: 0.0
      motor4: 0.0
      motor5: -10.0
      motor6: 10.0
      lifter: 5
      delay: 3.0

  pick:
    - motor1: -15.0
      motor2: -15.0
      motor3: 10.0
      motor4: 10.0
      motor5: 15.0
      motor6: -15.0
      lifter: 25
      delay: 3.0

  high:
    - motor1: -12.0
      motor2: -12.0
      motor3: 20.0
      motor4: 20.0
      motor5: 40.0
      motor6: -40.0
      lifter: 120
      delay: 0.0
